<!doctype html>
<html lang="en" dir="ltr" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Verify your email address</title>
  <!-- Built by `ds.py email`: dollar-sign token placeholders become literal values (light); the dark media query uses the dark_ profile. Write $$ for a literal dollar sign. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .bg-canvas { background-color: $dark_color_bg_canvas !important; }
      .bg-surface { background-color: $dark_color_bg_surface !important; }
      .text-default { color: $dark_color_text_default !important; }
      .text-muted { color: $dark_color_text_muted !important; }
    }
    [data-ogsc] .text-default { color: $dark_color_text_default !important; }
  </style>
</head>
<body class="bg-canvas" style="margin:0;padding:0;background-color:$color_bg_canvas;">
  <div style="display:none;max-height:0;overflow:hidden;">Confirm your address to finish setting up your account.&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg-canvas" style="background-color:$color_bg_canvas;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="bg-surface" style="width:100%;max-width:600px;background-color:$color_bg_surface;border-radius:$radius_lg;">
        <tr><td style="padding:32px;font-family:Arial,Helvetica,sans-serif;">
          <h1 class="text-default" style="margin:0 0 16px;font-size:24px;line-height:32px;color:$color_text_default;">Verify your email address</h1>
          <p class="text-muted" style="margin:0 0 24px;font-size:16px;line-height:24px;color:$color_text_muted;">Confirm this is your address so we can keep your account secure. The link expires in 24 hours.</p>
          <!--[if mso]>
          <v:roundrect href="{{verify_url}}" style="height:44px;v-text-anchor:middle;width:220px;" arcsize="18%" stroke="f" fillcolor="$color_action_primary_bg">
            <w:anchorlock/><center style="color:$color_action_primary_fg;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">Verify email address</center>
          </v:roundrect>
          <![endif]-->
          <!--[if !mso]><!-- -->
          <a href="{{verify_url}}" style="display:inline-block;padding:12px 24px;background-color:$color_action_primary_bg;color:$color_action_primary_fg;font-size:16px;font-weight:bold;line-height:20px;text-decoration:none;border-radius:$radius_md;">Verify email address</a>
          <!--<![endif]-->
          <p class="text-muted" style="margin:24px 0 0;font-size:14px;line-height:20px;color:$color_text_muted;">Didn't create an account? You can ignore this email.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
