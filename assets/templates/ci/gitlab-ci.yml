# Generated by `ds.py ci`. Design system pipeline: verify -> Storybook (GitLab Pages) -> npm publish.
stages: [check, build, publish]
variables: { DS_DIR: "__DIR__" }

check:
  stage: check
  image: python:3.12-slim
  script:
    - cd "$DS_DIR"
    - python3 tools/ds/scripts/ds.py build .
    - python3 tools/ds/scripts/ds.py check . --strict

pages:
  stage: build
  image: nikolaik/python-nodejs:python3.12-nodejs22
  script:
    - cd "$DS_DIR"
    - python3 tools/ds/scripts/ds.py storybook .
    - npm ci
    - npm run build-storybook
    - rm -rf "$CI_PROJECT_DIR/public" && mv storybook-static "$CI_PROJECT_DIR/public"
  artifacts: { paths: [public] }

publish:
  # Bump "version" in package.json and merge; this job publishes once and tags. Never tag by hand.
  stage: publish
  image: node:22
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NPM_TOKEN' }]
  script:
    - cd "$DS_DIR"
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - NAME=$(node -p "require('./package.json').name"); VERSION=$(node -p "require('./package.json').version")
    - if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "already published"; exit 0; fi
    - npm publish
    - 'curl -sf --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags?tag_name=v$VERSION&ref=$CI_COMMIT_SHA" || echo "tag not created (needs api scope)"'
