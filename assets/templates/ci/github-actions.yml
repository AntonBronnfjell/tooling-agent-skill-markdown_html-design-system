# Generated by `ds.py ci`. Design system pipeline: verify -> Storybook (GitHub Pages) -> npm publish.
name: design-system
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: write, pages: write, id-token: write }
defaults: { run: { working-directory: __DIR__ } }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/ds/scripts/ds.py build .
      - run: python3 tools/ds/scripts/ds.py check . --strict

  storybook:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: __DIR__/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/ds/scripts/ds.py storybook .
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: __DIR__/storybook-static }

  pages:
    if: github.ref == 'refs/heads/main'
    needs: storybook
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  publish:
    # Bump "version" in package.json and merge; this job publishes once and tags. Never tag by hand.
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: Publish if this version is new
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "NPM_TOKEN not set; skipping publish"; exit 0; }
          NAME=$(node -p "require('./package.json').name"); VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "$NAME@$VERSION already published"; exit 0; fi
          npm publish --provenance --access public
          git tag "v$VERSION" && git push origin "v$VERSION"
